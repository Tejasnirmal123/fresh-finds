services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: fresh-finds-db
    environment:
      - POSTGRES_DB=fresh_finds
      - POSTGRES_USER=fresh_finds_user
      - POSTGRES_PASSWORD=postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fresh_finds_user -d fresh_finds"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fresh-finds-network

  # Spring Boot Backend
  backend:
    build:
      context: ./fresh-finds/fresh-finds
      dockerfile: Dockerfile
    container_name: fresh-finds-backend
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/fresh_finds
      - SPRING_DATASOURCE_USERNAME=fresh_finds_user
      - SPRING_DATASOURCE_PASSWORD=postgres_password
      - JWT_SECRET=mySecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast256BitsLongForHS256Algorithm
      - API_BASE_PATH=/fresh-finds/api/v1
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fresh-finds-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/fresh-finds/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  frontend:
    build:
      context: ./organic-store
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8082/fresh-finds/api/v1
    container_name: fresh-finds-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - fresh-finds-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local

networks:
  fresh-finds-network:
    driver: bridge