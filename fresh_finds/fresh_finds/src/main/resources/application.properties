spring.application.name=fresh_finds
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/freshfinds}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

file.upload-dir=uploads/images
file.upload.max-size=10485760
file.upload.allowed-types=jpg,jpeg,png,gif,webp

r2.enabled=false
r2.bucket-name=
r2.account-id=
r2.access-key-id=
r2.secret-access-key=
r2.public-url=

brevo.api-key=
mail.from=
otp.expiry-minutes=10
otp.max-attempts=5
otp.resend-cooldown-seconds=60

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB

# Logging Configuration
logging.level.com.fresh_finds=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# API Configuration
api.base-path=/fresh-finds/api/v1
api.base-url=http://localhost:8081
cors.allowed.origins=http://localhost:5173,http://localhost:5173/

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast256BitsLongForHS256Algorithm
jwt.expiration=3600000