# Docker profile configuration
# This file is used when running in Docker containers

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fresh_finds}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-in-production-min-256-bits}
jwt.expiration=3600000

# API Configuration
api.base-path=${API_BASE_PATH:/fresh-finds/api/v1}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/images

# Email / OTP Configuration
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:}
otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}
otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}

# Cloudflare R2 Configuration
# Set R2_ENABLED=true and configure the values below to use R2 instead of local storage
# These are overridden via environment variables in Railway
r2.enabled=${R2_ENABLED:false}
r2.bucket-name=${R2_BUCKET_NAME:}
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.public-url=${R2_PUBLIC_URL:}

# Logging
logging.level.com.fresh_finds=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Server Configuration (Railway injects PORT at runtime; defaults to 8080 otherwise)
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always