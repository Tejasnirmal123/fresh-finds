apiVersion: apps/v1
kind: Deployment
metadata:
  name: fresh-finds-backend
  namespace: default
  labels:
    app: fresh-finds-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fresh-finds-backend
  template:
    metadata:
      labels:
        app: fresh-finds-backend
    spec:
      containers:
        - name: backend
          image: gcr.io/fresh-finds-1/fresh-finds-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Spring Profile
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"

            # Database Configuration (from secret)
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password

            # JWT Configuration (from secret)
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret

            # API Configuration
            - name: API_BASE_PATH
              value: "/fresh-finds/api/v1"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://your-frontend-domain.com,http://localhost:3000,http://localhost:5173"

            # Google Cloud Storage Configuration
            # IMPORTANT: Set these to enable GCS image storage
            - name: GCS_ENABLED
              value: "true"  # Set to "true" to use GCS, "false" for local storage
            - name: GCS_BUCKET_NAME
              value: "fresh-finds"  # Replace with your GCS bucket name
            - name: GCS_PROJECT_ID
              value: "fresh-finds-1"  # Replace with your GCP project ID

            # GCS Credentials Path
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/etc/gcs/key.json"

          # Health Check
          livenessProbe:
            httpGet:
              path: /fresh-finds/api/v1/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /fresh-finds/api/v1/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Resource Limits
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

          volumeMounts:
            - name: gcs-credentials
              mountPath: /etc/gcs
              readOnly: true

      volumes:
        - name: gcs-credentials
          secret:
            secretName: gcs-credentials

      # Optional: Image pull secrets if using private registry
      # imagePullSecrets:
      # - name: gcr-json-key

---
apiVersion: v1
kind: Service
metadata:
  name: fresh-finds-backend
  namespace: default
  labels:
    app: fresh-finds-backend
spec:
  type: LoadBalancer
  selector:
    app: fresh-finds-backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
